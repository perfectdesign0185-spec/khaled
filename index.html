<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>خالد عمر | مصمم جرافيك</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Preconnect & DNS-Prefetch for Fast Image Loading -->
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://lh3.googleusercontent.com">
  <link rel="preconnect" href="https://tkozhbrqabhzdkmwhgwf.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://tkozhbrqabhzdkmwhgwf.supabase.co">
  <link rel="preconnect" href="https://picsum.photos" crossorigin>
  <link rel="dns-prefetch" href="https://picsum.photos">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      scroll-behavior: smooth;
    }

    .gradient-text {
      background: linear-gradient(to left, #fbbf24, #f59e0b);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Hover animation for portfolio cards removed as requested */

    /* Marquee Animations - Refined for RTL */
    @keyframes marquee-left {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    @keyframes marquee-right {
      0% {
        transform: translateX(-50%);
      }

      100% {
        transform: translateX(0);
      }
    }

    .animate-marquee-left {
      animation: marquee-left 40s linear infinite;
      display: flex;
      width: max-content;
      min-width: 100%;
      will-change: transform;
    }

    .animate-marquee-right {
      animation: marquee-right 40s linear infinite;
      display: flex;
      width: max-content;
      min-width: 100%;
      will-change: transform;
    }

    .marquee-container:hover .animate-marquee-left,
    .marquee-container:hover .animate-marquee-right {
      animation-play-state: paused;
    }

    .lightbox-enter {
      animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="text-zinc-100 overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
